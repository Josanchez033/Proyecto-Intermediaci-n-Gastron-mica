# Perfil "postgres": se activa con  mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Antes, crear la base:  CREATE DATABASE cocina_promociones;
# La contraseña NO va en el código: se entrega con la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cocina_promociones}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false
