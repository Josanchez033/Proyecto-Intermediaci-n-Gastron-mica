spring.application.name=promociones
server.port=${PORT:8082}

# Base de datos por defecto: H2 guardada en archivo (./data), no necesita instalar nada.
# Para PostgreSQL: ejecutar con el perfil "postgres" (ver application-postgres.properties).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/promociones;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de H2 para mostrar las tablas: http://localhost:8082/h2-console
spring.h2.console.enabled=true

# Swagger: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
